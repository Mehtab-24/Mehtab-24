name: Generate Skyline SVG

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  skyline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Mehtab-24
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: github-skyline.svg
          plugin_skyline: yes
          plugin_skyline_year: current
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.6
          output_action: commit
          committer_branch: output
          committer_message: "chore: update skyline"