name: Generate Skyline 3D City

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  skyline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Render Skyline 3D Cityscape
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Mehtab-24
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          filename: github-skyline.svg
          plugin_skyline: yes
          plugin_skyline_year: 2025
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.8
          output_action: commit
          committer_branch: output
          committer_message: "chore: update 3D skyline"